services:
  theia:
    user: "${THEIA_UID:?Set THEIA_UID to the host UID}:${THEIA_GID:?Set THEIA_GID to the host GID}"
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THEIA_VERSION: 2.0.0
        THEIA_UID: "${THEIA_UID:?Set THEIA_UID to the host UID}"
        THEIA_GID: "${THEIA_GID:?Set THEIA_GID to the host GID}"
    image: theia-agent:2.0.0
    env_file:
      - .env
    environment:
      THEIA_HOME: /data
      THEIA_STATE: /data/sessions.json
      CODEX_CWD: /workspace
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - type: bind
        source: ${HOME}/.theia
        target: /data
      - type: bind
        source: ${HOME}/theia-workspace
        target: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped

x-podman:
  in_pod: false
