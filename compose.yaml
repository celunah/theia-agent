services:
  theia:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THEIA_VERSION: 2.1.0
        THEIA_UID: "${THEIA_UID:-1000}"
        THEIA_GID: "${THEIA_GID:-1000}"
    image: theia-agent:2.1.0
    env_file:
      - .env
    environment:
      THEIA_CONTAINER: "1"
      THEIA_UID: "${THEIA_UID:-1000}"
      THEIA_GID: "${THEIA_GID:-1000}"
      THEIA_HOME: /data
      THEIA_STATE: /data/sessions.json
      CODEX_CWD: /workspace
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - type: bind
        source: ${HOME}/.theia
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/theia-workspace
        target: /workspace
        bind:
          create_host_path: false
    stdin_open: true
    tty: true
    restart: unless-stopped

x-podman:
  in_pod: false
