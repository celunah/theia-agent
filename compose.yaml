services:
  theia:
    userns_mode: "keep-id:uid=10001,gid=10001"
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THEIA_COMMIT: ${THEIA_COMMIT:-unknown}
        THEIA_VERSION: 1.0.2
    image: theia-agent:1.0.2
    env_file:
      - .env
    environment:
      THEIA_HOME: /data
      THEIA_STATE: /data/sessions.json
      CODEX_CWD: /workspace
    volumes:
      - type: bind
        source: ${HOME}/.theia
        target: /data
      - type: bind
        source: ${HOME}/theia-workspace
        target: /workspace
    restart: unless-stopped

x-podman:
  in_pod: false
