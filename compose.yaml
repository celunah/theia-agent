services:
  theia:
    build:
      context: .
      dockerfile: Dockerfile
    image: theia-agent:1.0.1
    env_file:
      - .env
    environment:
      THEIA_HOME: /data/theia
      THEIA_STATE: /data/theia/sessions.json
      CODEX_CWD: /workspace
    volumes:
      - theia-data:/data
      - theia-workspace:/workspace
    restart: unless-stopped

volumes:
  theia-data:
  theia-workspace:
